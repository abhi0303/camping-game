# Farm World API (Cloudflare Worker). Deploy: npx wrangler deploy
# Secrets are set with `npx wrangler secret put NAME` and are never stored in this repo:
#   DATABASE_URL   Neon connection string (postgresql://...)
#   SERVER_SECRET  long random string: signs join tickets and hashes PINs / invite codes
#   ADMIN_SECRET   long random string: allows POST /v1/admin/migrate
name = "rv-van-api"
main = "src/index.js"
compatibility_date = "2025-10-01"

[vars]
# web pages allowed to call the API (localhost / 127.0.0.1 are always allowed for testing)
ALLOWED_ORIGINS = "https://abhi0303.github.io"
